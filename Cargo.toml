[package]
name = "flyer-orm"
version = "1.0.0"
edition = "2024"
authors = ["Themba Lucas Ngubeni <thembangubeni04@email.com>"]
license = "MIT"
description = "A simple, lightweight, and asynchronous ORM for Rust, currently supporting SQLite."
readme = "README.md"
homepage = "https://github.com/lucas11776-golang/flyer-orm"
repository = "https://github.com/lucas11776-golang/flyer-orm"
build = "build.rs"

[build-dependencies]
git2 = "0.20.4"

[dependencies]
flyer-orm-derive = { version = "0.1.0", path = "./flyer-orm-derive" }

anyhow = "1.0.102"
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1", features = ["full"] }

async-trait = "0.1.89"
async-std = "1.13.2"
uuid = { version = "1.21.0", features = ["v4"] }
dotenv = "0.15.0"
geo = "0.33.1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "any", "sqlite", "mysql", "postgres", "macros", "uuid", "derive", "migrate", "json"] }

geo-types = { version = "0.7.19", features = ["serde"] }
geozero = { version = "0.14", features = ["with-postgis-sqlx"] }
once_cell = "1.21.4"
